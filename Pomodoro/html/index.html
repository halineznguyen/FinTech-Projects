<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div id="switch">
            <button id="work" class="tab tab-active">Work</button>
            <button id="break" class="tab tab-inactive">Break</button>
            <button id="long-break" class="tab tab-inactive">Long Break</button>
        </div>

        <div id="timer">25:00</div>
        <div id="clock-state"></div>
        <div id="show-session"></div>

        <div id="task-specific">
            <div id="enter-task-textbox" class="active">
                <input id="task-input" type="text" placeholder="Enter task">
            </div>

            <div id="show-task"></div>
        </div>

        <div>
            <button id="start-button" class="operation-button active" type="submit">Start</button>
            <button id="end-button" class="operation-button inactive" type="submit">End</button>
        </div>

    </div>

    

    <script src="../js/script.js"></script>
    
</body>
</html>
